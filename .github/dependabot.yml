# Version updates, one pull request a week per ecosystem, patch and minor updates grouped so
# the list of open pull requests stays readable. Major versions are not proposed: each one
# (Electron, TypeScript, the Actions runtimes) needs a deliberate upgrade and a test on Windows. Security advisories open their own pull
# requests whatever this schedule says, once Dependabot security updates are switched on in
# the repository settings. The weekly audit workflow (audit.yml) reports what is vulnerable
# now; this keeps it from piling up.
version: 2
updates:
  # uv.lock is what CI and the desktop build install (scripts/install_locked.py). lockfile-only
  # moves the lock within pyproject.toml's ranges and never rewrites a range, so the ranges stay
  # what the code is known to need; widening one is a deliberate change by hand, with `uv lock`.
  - package-ecosystem: uv
    directory: /office-agent
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.14 removed Part.thought_signature, which the code needs (issue #299).
      - dependency-name: "google-genai"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /office-agent/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /office-agent-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
