name: Mutation

# Coverage shows that code ran, not that a test checked it. Mutation testing changes the
# code (a `<` to `<=`, a deleted line) and reports the changes no test notices. It runs on
# the modules where a silent mistake is a security or data problem (the list is MODULES in
# scripts/mutation.py), nightly, by hand, and on a pull request that changes this job. It
# reports and never fails because of a survivor: each survivor is a gap to turn into an
# issue. It is not a required check.
"on":
  schedule:
    - cron: "43 20 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mutation.yml"
      - "office-agent/scripts/mutation.py"

# The event is part of the group so a manual or pull request run on the same ref never
# cancels the nightly one.
concurrency:
  group: mutation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: office-agent

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      keys: ${{ steps.list.outputs.keys }}
    steps:
      - uses: actions/checkout@v4

      # MODULES in the script is the one list; the matrix follows it.
      - id: list
        run: echo "keys=$(python3 scripts/mutation.py list | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  mutate:
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.keys) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: office-agent/pyproject.toml

      # The package itself stays uninstalled: an editable install would put the
      # unmutated source ahead of the mutated copy on sys.path.
      - name: Install the dependencies
        run: |
          pip install ".[dev,web]"
          pip install -U "google-genai>=2.13.0,<2.14.0"
          pip uninstall -y coscribe
          pip install mutmut==3.8.0

      - name: Mutate ${{ matrix.module }}
        run: python scripts/mutation.py run ${{ matrix.module }} --out mutation-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.module }}
          path: office-agent/mutation-results/

  summary:
    needs: [modules, mutate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: office-agent/mutation-results
          merge-multiple: true

      - name: Table
        run: python3 scripts/mutation.py summary mutation-results >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-survivors
          path: |
            office-agent/mutation-results/*-survivors.txt
            office-agent/mutation-results/*.json
