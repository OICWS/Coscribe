name: coscribe CI

"on":
  push:
    # A pull request is checked by the pull_request run below; running both
    # on every push to its branch doubled the work.
    branches: [main]
  pull_request:
    # No `paths:` filter: a required check that never starts would keep a
    # docs-only pull request from ever merging.
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: office-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the changed-lines coverage compares with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pull request that changes documentation only runs the documentation
      # tests (scripts/ci_scope.py says which files count). The job still runs
      # and reports, because `test` is a required check; main always runs all.
      - name: Decide what to check
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi
          grep '^scope=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: office-agent/pyproject.toml

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope == 'full'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-agent/frontend/package-lock.json

      # web/static/ is a gitignored build artifact (see frontend/README.md
      # and web/app.py's own module docstring) -- create_app_lg() mounts
      # it with check_dir=True, so any test that constructs the FastAPI
      # app (most of tests/web/) fails at app-construction time
      # with a bare checkout that never built it. Real, live-reported gap:
      # this step was missing from CI since the frontend cutover itself,
      # silently failing every run after -- caught only by finally
      # checking the Actions tab directly instead of trusting local runs
      # (which always had a hand-built static/ dir already sitting there).
      - name: Install frontend dependencies
        if: steps.scope.outputs.scope == 'full'
        working-directory: office-agent/frontend
        run: npm ci

      - name: Install coscribe
        run: pip install -e ".[dev,web]"

      # See pyproject.toml's dependencies comment: aisuite 0.1.14 pins
      # httpx<0.28.0, which conflicts with google-genai>=1.5.0's own
      # httpx>=0.28.1 requirement, so the two can't be resolved together in
      # one `pip install` -- google-genai has to be upgraded as its own
      # separate step afterward. Without this, pip resolves google-genai to
      # the old <1.5.0 pin, whose Part type doesn't have thought_signature
      # yet, and test_gemini_provider.py's real-SDK validation test fails.
      # Upper-bounded at <2.14.0 -- 2.14.0 removed Part.thought_signature
      # again (an upstream regression, confirmed by diffing its model_fields
      # against 2.13.0's), which breaks the exact same test the other way.
      - name: Upgrade google-genai (needed for Part.thought_signature)
        if: steps.scope.outputs.scope == 'full'
        run: pip install -U "google-genai>=2.13.0,<2.14.0"

      # The one command contributors run locally too: builds the frontend
      # (tsc -b, vite), then ruff, mypy and pytest. Keeping them in one script
      # is what keeps "passes locally" and "passes in CI" the same thing.
      - name: Checks
        if: steps.scope.outputs.scope == 'full'
        run: bash scripts/check.sh
        env:
          COSCRIBE_COVERAGE: "1"

      - name: Documentation checks
        if: steps.scope.outputs.scope == 'docs'
        run: python -m pytest -q $(python scripts/ci_scope.py --tests)

      # Report only for now: what the lines this pull request changed lack in
      # coverage. It becomes a failing check after a week of numbers.
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope == 'full'
        continue-on-error: true
        run: |
          pip install diff-cover
          diff-cover coverage.xml --compare-branch=origin/main \
            --format markdown:diff-coverage.md
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"

  # Typechecks the Electron shell, which had no check at all. Not a required
  # check until it has passed once.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office-agent-desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-agent-desktop/package-lock.json

      - run: npm ci

      - run: npm run typecheck
