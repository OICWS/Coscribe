name: Windows

# What a Windows machine would catch that the Linux job cannot: paths, the code page,
# PowerShell and cmd, the keychain. `pytest` is a required check (decision 0009, after two weeks
# of green nights), so it runs on every pull request, nightly and by hand.
"on":
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  pull_request:
    # No `paths:` filter: a required check that never starts would keep a pull request from
    # ever merging.
    branches: [main]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: office-agent

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The whole history, so the pull request's diff against its base can be read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: office-agent/uv.lock

      # A pull request runs the tests its change can reach, and one that changes documentation
      # only runs none of the steps below (scripts/ci_scope.py, decision 0059, the same rule as
      # the Linux `test` job). The job still runs and reports rather than being skipped with
      # `if:`, because a job skipped after a failed `needs:` would also count as passed.
      - name: Decide what to check
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            python scripts/ci_scope.py < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
            echo "tests=$(python scripts/ci_scope.py --tests < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "tests=" >> "$GITHUB_OUTPUT"
          fi
          grep '^scope=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      # Reads uv.lock for scripts/install_locked.py.
      - uses: astral-sh/setup-uv@v7
        if: steps.scope.outputs.scope != 'docs'
        with:
          version: "0.13.7"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope != 'docs'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-agent/frontend/package-lock.json

      # web/static/ is a build output that tests constructing the app need.
      - name: Build the frontend
        if: steps.scope.outputs.scope != 'docs'
        working-directory: office-agent/frontend
        run: |
          npm ci
          npm run build

      - name: Install coscribe
        if: steps.scope.outputs.scope != 'docs'
        run: |
          python scripts/install_locked.py --extra dev --extra web

      # The text widths the deck engine sizes boxes with, measured on this machine's fonts.
      # The table is committed; the test below keeps it equal to the fonts.
      - name: Measure font advances
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/measure_font_advances.py "C:/Windows/Fonts" --out windows-font-advances.json

      - name: Tests
        if: steps.scope.outputs.scope != 'docs'
        run: python -m pytest -q -n 4 -p no:cacheprovider --tb=short -rfE --junitxml=windows-junit.xml ${{ steps.scope.outputs.tests }}

      - name: Summary of the failures
        if: always() && steps.scope.outputs.scope != 'docs'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("windows-junit.xml").getroot()
          except OSError:
              print("No test report was written.")
              raise SystemExit
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          failed = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase")
              if case.find("failure") is not None or case.find("error") is not None
          ]
          print(f"## Windows: {suite.get('tests')} tests, {len(failed)} failed or errored\n")
          for name in failed:
              print(f"- `{name}`")
          PY

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.scope != 'docs'
        with:
          name: windows-junit
          path: |
            office-agent/windows-junit.xml
            office-agent/windows-font-advances.json
