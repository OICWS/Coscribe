name: Windows sandbox prototype

# Issue #560, step 1: does a script venv's python.exe run under an AppContainer, reach only the
# folders granted to it, and stay off the network? Runs on a pull request that changes the
# prototype or this file, and by hand. Kept apart from windows.yml (decision 0009).
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-sandbox-prototype.yml"
      - "office-agent/scripts/prototype_script_sandbox.py"
      - "office-agent/scripts/prototype_folder_grants.py"
      - "office-agent/scripts/prototype_codex_sandbox.py"

permissions:
  contents: read

concurrency:
  group: windows-sandbox-prototype-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: office-agent

jobs:
  appcontainer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AppContainer probe
        run: python scripts/prototype_script_sandbox.py

      # Runs even when the probe above fails: the two answer separate questions.
      - name: Folder grants by capability, no-delete folders, large folders, SMB and exFAT
        if: always()
        run: python scripts/prototype_folder_grants.py

      - name: Codex's own sandbox (mxc, elevated, unelevated) with coscribe's folders
        if: always()
        run: python scripts/prototype_codex_sandbox.py

      # The runner's account is an elevated admin; a user's laptop often is not. The same probe
      # as a fresh standard user shows whether AppContainer and the folder ACLs need admin.
      - name: Script probe as a standard user
        if: always()
        shell: pwsh
        run: |
          $password = "Cs-" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "!a1"
          # New-LocalUser, not net user: net asks a Y/N question for passwords over 14 characters.
          New-LocalUser -Name csproto -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          $out = "C:\csproto-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          icacls $out /grant "Everyone:(OI)(CI)(M)" | Out-Null
          $python = (Get-Command python).Source
          $script = (Resolve-Path scripts/prototype_script_sandbox.py).Path
          Copy-Item $script $out
          Copy-Item scripts/prototype_folder_grants.py $out
          $cred = New-Object System.Management.Automation.PSCredential("csproto", (ConvertTo-SecureString $password -AsPlainText -Force))
          $p = Start-Process -FilePath $python -ArgumentList "$out\prototype_script_sandbox.py" `
            -Credential $cred -LoadUserProfile -WorkingDirectory $out -Wait -PassThru `
            -RedirectStandardOutput "$out\stdout.txt" -RedirectStandardError "$out\stderr.txt"
          Get-Content "$out\stdout.txt", "$out\stderr.txt" -ErrorAction SilentlyContinue
          Write-Output "script probe as csproto: exit $($p.ExitCode)"
          $p = Start-Process -FilePath $python -ArgumentList "$out\prototype_folder_grants.py" `
            -Credential $cred -LoadUserProfile -WorkingDirectory $out -Wait -PassThru `
            -RedirectStandardOutput "$out\stdout2.txt" -RedirectStandardError "$out\stderr2.txt"
          Get-Content "$out\stdout2.txt", "$out\stderr2.txt" -ErrorAction SilentlyContinue
          Write-Output "folder grants as csproto: exit $($p.ExitCode)"
          Remove-LocalUser -Name csproto
