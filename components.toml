# The component map: the one list of what a session can work in. `docs/components.md` and the
# generated block of `.github/CODEOWNERS` come from it (`python office-agent/scripts/gen_components.py`);
# `tests/test_components_map.py` fails when they are stale or the map disagrees with the tree.
#
# layer: the import layer from the root AGENTS.md; a component imports only from layers below.
# owner: a GitHub login or team that reviews changes here.
# card: the component's AGENTS.md; leave it out only for a single module or a component whose
#       card is not written yet.
# protected_modules: only for a component that has loose modules beside its sub-components
#       (`tools`): the modules that may be imported only from inside it. Every other package
#       protects all of its direct children.
# ignore_imports: today's imports from outside into a component's submodules. Each is a line
#       of debt: the list may only shrink (an entry that no longer matches fails
#       `lint-imports`), and a new import goes through the component's `__init__.py` instead.
#
# Every package here gets an import-linter "protected" contract, generated into the last block
# of `office-agent/pyproject.toml`.

[[component]]
name = "cli"
path = "office-agent/src/coscribe/cli.py"
layer = "cli"
owner = ["@OICWS"]

[[component]]
name = "web"
path = "office-agent/src/coscribe/web"
