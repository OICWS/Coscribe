<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei">
  <g><rect x="0" y="0" width="1280.00" height="720.00" fill="#FFFFFF" /></g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <text x="64" y="72" font-size="14" fill="#B4342C" letter-spacing="2">TREND AND TRAJECTORY</text>
  <text id="title" x="64" y="128" font-size="36" fill="#1E293B">South halved in September while North grew into it</text>
  <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8DEE5" stroke-width="1" />

  <g id="trend-chart"><g><g data-native="chart"><rect x="227.68" y="601.65" width="10.45" height="10.45" fill="#1E293B" /><text x="242.62" y="612.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">North</text><rect x="294.07" y="601.65" width="10.45" height="10.45" fill="#2B6CB0" /><text x="309.00" y="612.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">East</text><rect x="353.82" y="601.65" width="10.45" height="10.45" fill="#2E7D5B" /><text x="368.75" y="612.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">Southwest</text><rect x="453.42" y="601.65" width="10.45" height="10.45" fill="#B4342C" /><text x="468.35" y="612.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">South</text><rect x="522.31" y="601.65" width="10.45" height="10.45" fill="#B7791F" /><text x="537.24" y="612.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">Central</text><line x1="139.40" y1="570.29" x2="755.04" y2="570.29" stroke="#D9D9D9" stroke-width="1" /><text x="133.43" y="575.52" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">0</text><line x1="139.40" y1="448.52" x2="755.04" y2="448.52" stroke="#D9D9D9" stroke-width="1" /><text x="133.43" y="453.74" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">500,000</text><line x1="139.40" y1="326.74" x2="755.04" y2="326.74" stroke="#D9D9D9" stroke-width="1" /><text x="133.43" y="331.96" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">1,000,000</text><line x1="139.40" y1="204.96" x2="755.04" y2="204.96" stroke="#D9D9D9" stroke-width="1" /><text x="133.43" y="210.19" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">1,500,000</text><text x="242.01" y="591.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Jul</text><text x="447.22" y="591.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Aug</text><text x="652.43" y="591.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Sep</text><polyline points="242.01,324.30 447.22,354.99 652.43,274.86" fill="none" stroke="#1E293B" stroke-width="2.5" /><polyline points="242.01,285.09 447.22,382.51 652.43,357.91" fill="none" stroke="#2B6CB0" stroke-width="2.5" /><polyline points="242.01,365.22 447.22,358.64 652.43,325.76" fill="none" stroke="#2E7D5B" stroke-width="2.5" /><polyline points="242.01,343.30 447.22,305.30 652.43,440.23" fill="none" stroke="#B4342C" stroke-width="2.5" /><polyline points="242.01,420.75 447.22,348.41 652.43,409.55" fill="none" stroke="#B7791F" stroke-width="2.5" /><line x1="139.40" y1="570.29" x2="755.04" y2="570.29" stroke="#BFBFBF" stroke-width="1" /></g></g></g>

  <text x="816" y="200" font-size="15" fill="#64748B" letter-spacing="1">WHAT MOVED</text>

  <text x="816" y="244" font-size="20" fill="#1E293B">South fell 50.9% in September</text>
  <text x="816" y="272" font-size="17" fill="#334155">1.09M down to 534k, its weakest</text>
  <text x="816" y="296" font-size="17" fill="#334155">month; Smart speaker and Robot</text>
  <text x="816" y="320" font-size="17" fill="#334155">vacuum both fell to 89k.</text>

  <line x1="816" y1="348" x2="1216" y2="348" stroke="#D8DEE5" stroke-width="1" />

  <text x="816" y="386" font-size="20" fill="#1E293B">North took 39.0% of its quarter</text>
  <text x="816" y="414" font-size="17" fill="#334155">in September (1.21M of 3.11M),</text>
  <text x="816" y="438" font-size="17" fill="#334155">ending above July and posting</text>
  <text x="816" y="462" font-size="17" fill="#334155">the mildest decline, -29.4%.</text>

  <line x1="816" y1="490" x2="1216" y2="490" stroke="#D8DEE5" stroke-width="1" />

  <text x="816" y="528" font-size="20" fill="#1E293B">Southwest never declined</text>
  <text x="816" y="556" font-size="17" fill="#334155">842k, 869k, 1.00M across the</text>
  <text x="816" y="580" font-size="17" fill="#334155">quarter, the steadiest line here</text>
  <text x="816" y="604" font-size="17" fill="#334155">and still only 49.4% of plan.</text>

  <text x="64" y="694" font-size="13" fill="#64748B">Source: Q3 sales.xlsx — Orders, revenue by region and month.</text>
  <text x="1216" y="694" font-size="13" fill="#64748B" text-anchor="end">4</text>

  <desc id="notes">Three shapes in one chart. South looks volatile because of one month: August 1.09M down to September 534k. North's quarter is back-loaded, with September carrying 39% of it. Southwest is the only region that rose every month, and it still only reached 49.4% of plan, which says the target was set far above the run rate.</desc>
</svg>