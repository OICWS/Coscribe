  <text x="640" y="548" font-size="16" fill="#64748B">Revenue fell 6.3% from July to September (4.57M to 4.28M).</text>
  <text x="640" y="574" font-size="16" fill="#64748B">Margin moved less than a point, between 35.2% and 36.8%.</text>

  <text x="64" y="610" font-size="16" fill="#64748B">The Targets sheet carries a Q3 revenue target and Q2 actual per region only, so no gross profit or margin variance</text>
  <text x="64" y="634" font-size="16" fill="#64748B">is shown against plan.</text>

  <text x="64" y="694" font-size="13" fill="#64748B">Source: Q3 sales.xlsx — Orders (60 rows), Targets.</text>
  <text x="1216" y="694" font-size="13" fill="#64748B" text-anchor="end">2</text>

  <desc id="notes">The headline: 57.4% of a $23.3M plan, a gap of $9.93M, and 37.2% below Q2. Gross profit was $4.80M at 35.87% margin. Revenue declined month on month by 6.3% while margin stayed flat, so the quarter lost volume rather than price.</desc>
