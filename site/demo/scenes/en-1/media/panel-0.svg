<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei">
  <g><rect x="0" y="0" width="1280.00" height="720.00" fill="#FFFFFF" /></g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <text x="64" y="88" font-size="14" fill="#B4342C" letter-spacing="2">QUARTERLY BUSINESS REVIEW</text>

  <text id="title" x="64" y="196" font-family="Georgia" font-size="52" fill="#1E293B">Q3 2026 closed at $13.38M —</text>
  <text x="64" y="258" font-family="Georgia" font-size="52" fill="#1E293B">57.4% of plan, 37.2% below Q2</text>

  <text x="64" y="318" font-size="22" fill="#334155">All five regions missed plan, and revenue declined in</text>
  <text x="64" y="352" font-size="22" fill="#334155">every month. The plan sets no margin target to test.</text>

  <line x1="64" y1="470" x2="1216" y2="470" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="512" font-size="14" fill="#64748B" letter-spacing="1">REVENUE</text>
  <text x="64" y="556" font-family="Georgia" font-size="40" fill="#1E293B">$13,375,000</text>

  <text x="352" y="512" font-size="14" fill="#64748B" letter-spacing="1">GROSS PROFIT</text>
  <text x="352" y="556" font-family="Georgia" font-size="40" fill="#1E293B">$4,798,139</text>

  <text x="704" y="512" font-size="14" fill="#64748B" letter-spacing="1">GROSS MARGIN</text>
  <text x="704" y="556" font-family="Georgia" font-size="40" fill="#1E293B">35.87%</text>

  <text x="928" y="512" font-size="14" fill="#64748B" letter-spacing="1">ORDERS</text>
  <text x="928" y="556" font-family="Georgia" font-size="40" fill="#1E293B">60</text>

  <text x="64" y="694" font-size="13" fill="#64748B">Source: Q3 sales.xlsx — Orders (60 rows, Jul–Sep 2026), Targets.</text>
  <text x="1216" y="694" font-size="13" fill="#64748B" text-anchor="end">1</text>

  <g id="cover-monthly">
    <text x="880" y="146" font-size="14" fill="#64748B">Revenue by month ($M)</text>
    <line x1="880" y1="430" x2="1216" y2="430" stroke="#1E293B" stroke-width="1" />
    <rect x="890" y="183" width="66" height="247" fill="#94A3B8" />
    <rect x="1000" y="185" width="66" height="245" fill="#94A3B8" />
    <rect x="1110" y="199" width="66" height="231" fill="#B4342C" />
    <text x="923" y="172" font-size="15" fill="#1E293B" text-anchor="middle">4.57</text>
    <text x="1033" y="172" font-size="15" fill="#1E293B" text-anchor="middle">4.52</text>
    <text x="1143" y="188" font-size="15" fill="#1E293B" text-anchor="middle">4.28</text>
    <text x="923" y="454" font-size="15" fill="#64748B" text-anchor="middle">Jul</text>
    <text x="1033" y="454" font-size="15" fill="#64748B" text-anchor="middle">Aug</text>
    <text x="1143" y="454" font-size="15" fill="#64748B" text-anchor="middle">Sep</text>
  </g>

  <desc id="notes">Q3 2026: revenue of $13.38M against a $23.3M plan, 37.2% below the $21.3M we booked in Q2. Gross margin at 35.87% says the miss is volume, not price. All five regions missed, and revenue declined in each month of the quarter.</desc>
