<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei">
  <g><rect x="0" y="0" width="1280.00" height="720.00" fill="#FFFFFF" /></g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <text x="64" y="72" font-size="14" fill="#B4342C" letter-spacing="2">VARIANCE DRIVER</text>
  <text id="title" x="64" y="128" font-size="36" fill="#1E293B">Robot vacuums, not cameras, drove the September decline</text>
  <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="206" font-size="15" fill="#64748B" letter-spacing="1">THE BIGGEST MOVE</text>
  <text x="64" y="262" font-family="Georgia" font-size="56" fill="#B4342C">-41.3%</text>
  <text x="64" y="298" font-size="19" fill="#1E293B">Robot vacuum, August to September</text>
  <text x="64" y="326" font-size="17" fill="#334155">1,287,000 down to 755,000, a fall of</text>
  <text x="64" y="350" font-size="17" fill="#334155">532,000. It was the largest product</text>
  <text x="64" y="374" font-size="17" fill="#334155">in August and the smallest in September.</text>

  <line x1="64" y1="408" x2="510" y2="408" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="448" font-size="20" fill="#1E293B">Security camera offset part of it</text>
  <text x="64" y="476" font-size="17" fill="#334155">1,014,000 in August to 1,313,000 in</text>
  <text x="64" y="500" font-size="17" fill="#334155">September, +29.5%, the largest gain</text>
  <text x="64" y="524" font-size="17" fill="#334155">of the final month.</text>

  <line x1="64" y1="556" x2="510" y2="556" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="596" font-size="20" fill="#1E293B">Net effect: total revenue -6.3%</text>
  <text x="64" y="624" font-size="17" fill="#334155">4,569,000 in July to 4,283,000 in</text>
  <text x="64" y="648" font-size="17" fill="#334155">September; Smart lock fell 7.5% Aug to Sep.</text>

  <g id="product-month-chart"><g><g data-native="chart"><rect x="807.08" y="613.65" width="10.45" height="10.45" fill="#C9D2DB" /><text x="822.02" y="624.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">Jul</text><rect x="856.04" y="613.65" width="10.45" height="10.45" fill="#94A3B8" /><text x="870.97" y="624.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">Aug</text><rect x="912.48" y="613.65" width="10.45" height="10.45" fill="#1E293B" /><text x="927.41" y="624.11" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="start">Sep</text><line x1="635.40" y1="582.29" x2="1207.04" y2="582.29" stroke="#D9D9D9" stroke-width="1" /><text x="629.43" y="587.52" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">0</text><line x1="635.40" y1="456.52" x2="1207.04" y2="456.52" stroke="#D9D9D9" stroke-width="1" /><text x="629.43" y="461.74" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">500,000</text><line x1="635.40" y1="330.74" x2="1207.04" y2="330.74" stroke="#D9D9D9" stroke-width="1" /><text x="629.43" y="335.96" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">1,000,000</text><line x1="635.40" y1="204.96" x2="1207.04" y2="204.96" stroke="#D9D9D9" stroke-width="1" /><text x="629.43" y="210.19" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="end">1,500,000</text><text x="706.85" y="603.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Security camera</text><text x="849.76" y="603.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Smart lock</text><text x="992.67" y="603.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Smart speaker</text><text x="1135.58" y="603.20" font-family="Arial, Microsoft YaHei" font-size="14.93" fill="#334155" text-anchor="middle">Robot vacuum</text><rect x="659.22" y="213.76" width="31.76" height="368.53" fill="#C9D2DB" /><rect x="802.13" y="300.80" width="31.76" height="281.49" fill="#C9D2DB" /><rect x="945.04" y="318.66" width="31.76" height="263.63" fill="#C9D2DB" /><rect x="1087.95" y="346.59" width="31.76" height="235.71" fill="#C9D2DB" /><rect x="690.97" y="327.22" width="31.76" height="255.08" fill="#94A3B8" /><rect x="833.89" y="290.74" width="31.76" height="291.55" fill="#94A3B8" /><rect x="976.80" y="314.89" width="31.76" height="267.40" fill="#94A3B8" /><rect x="1119.71" y="258.54" width="31.76" height="323.75" fill="#94A3B8" /><rect x="722.73" y="252.00" width="31.76" height="330.29" fill="#1E293B" /><rect x="865.64" y="312.63" width="31.76" height="269.67" fill="#1E293B" /><rect x="1008.55" y="294.77" width="31.76" height="287.53" fill="#1E293B" /><rect x="1151.46" y="392.37" width="31.76" height="189.92" fill="#1E293B" /><line x1="635.40" y1="582.29" x2="1207.04" y2="582.29" stroke="#BFBFBF" stroke-width="1" /></g></g></g>

  <text x="64" y="694" font-size="13" fill="#64748B">Source: Q3 sales.xlsx — Orders, revenue by product and month.</text>
  <text x="1216" y="694" font-size="13" fill="#64748B" text-anchor="end">5</text>

  <desc id="notes">The September step down is one product: Robot vacuum, from 1,287,000 in August to 755,000. Security camera grew 29.5% over the same month, which is why the total only fell 6.3% rather than collapsing. Robot vacuum was the largest product in August and the smallest in September.</desc>
</svg>