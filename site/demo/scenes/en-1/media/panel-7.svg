  <text x="64" y="694" font-size="13" fill="#64748B">Source: Q3 sales.xlsx — Orders, Targets. Actions are proposals; no owner or date is set in the source file.</text>
  <text x="1216" y="694" font-size="13" fill="#64748B" text-anchor="end">8</text>

  <desc id="notes">Three things for Q4. First, Southwest: the plan is the problem, at 49.4% attainment on a region that grew every month, so re-base it rather than chase it. Second, North's margin: the biggest region runs the thinnest margin, and its Smart speaker is 10.1 points below the same product in Central. Third, South and the account base: September halved, and revenue is 76.4% concentrated in five accounts, the largest with the weakest margin.</desc>
