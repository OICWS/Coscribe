<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei">
  <g><rect x="0" y="0" width="1280.00" height="720.00" fill="#FFFFFF" /></g><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <text x="64" y="72" font-size="14" fill="#B4342C" letter-spacing="2">CORRECTIVE ACTION</text>
  <text id="title" x="64" y="128" font-size="36" fill="#1E293B">Three commitments the Q4 plan has to carry</text>
  <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="196" font-size="24" fill="#B4342C" font-family="Georgia">01</text>
  <text x="120" y="196" font-size="21" fill="#1E293B">Re-base the Southwest plan to its run rate</text>
  <text x="120" y="228" font-size="17" fill="#334155">A gap of $2,785,000 and 49.4% attainment, yet the region rose every month.</text>
  <text x="120" y="252" font-size="17" fill="#334155">The plan, not the region, is what needs correcting before Q4 is judged.</text>

  <line x1="64" y1="288" x2="740" y2="288" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="336" font-size="24" fill="#B4342C" font-family="Georgia">02</text>
  <text x="120" y="336" font-size="21" fill="#1E293B">Recover North's margin</text>
  <text x="120" y="368" font-size="17" fill="#334155">Largest region at 23.2% of revenue and the lowest margin, 34.0% against</text>
  <text x="120" y="392" font-size="17" fill="#334155">38.2% in South. Its Smart speaker runs 30.4%, 10.1 points under Central.</text>

  <line x1="64" y1="428" x2="740" y2="428" stroke="#D8DEE5" stroke-width="1" />

  <text x="64" y="476" font-size="24" fill="#B4342C" font-family="Georgia">03</text>
  <text x="120" y="476" font-size="21" fill="#1E293B">Protect South's September and the top accounts</text>
  <text x="120" y="508" font-size="17" fill="#334155">South's revenue halved in September, to $534,000. The top five accounts are</text>
  <text x="120" y="532" font-size="17" fill="#334155">76.4% of revenue, and the largest of them carries the weakest margin.</text>

  <rect x="784" y="184" width="432" height="424" fill="#F4F6F8" />

  <text x="808" y="220" font-size="13" fill="#64748B" letter-spacing="2">CONCENTRATION</text>
  <text x="808" y="300" font-family="Georgia" font-size="60" fill="#1E293B">76.4%</text>
  <text x="808" y="332" font-size="17" fill="#334155">of Q3 revenue comes from the five</text>
  <text x="808" y="356" font-size="17" fill="#334155">largest accounts below.</text>

