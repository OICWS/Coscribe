  <text x="64" y="636" font-size="20" fill="#1E293B">四品类规模都在 350.6 万—466.1 万元之间，没有爆款也没有短板：四季度能动的不是总量，是结构。</text>
  <text x="64" y="684" font-size="13" fill="#6B7280">数据来源：Q3销售数据.xlsx 明细页，按品类汇总</text>

  <text id="pagenum" x="1196" y="692" font-family="Cambria" font-size="13" fill="#6B7280">6</text>
  <desc id="notes">产品这一路，先说结论：扫地机器人是唯一可以无条件加码的品类，466.1 万元规模第一、39.97% 毛利也是第一。智能音箱是第二大品类，376.7 万元，但毛利率 35.91% 垫底，毛利额 135.3 万元反而低于规模更小的门锁 142.2 万元——典型的卖得多赚得薄。四个品类规模都在 350 到 466 万元之间，没有爆款也没有短板，所以四季度能动的不是总量，是结构。</desc>
