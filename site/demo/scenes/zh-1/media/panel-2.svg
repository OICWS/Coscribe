  <rect x="64" y="620" width="1152" height="1" fill="#D6DDE4" />
  <text x="64" y="656" font-size="20" fill="#1E293B">8 月是「量」的问题，9 月是「价」的修复：收入仍比 7 月低 14.4 万元，毛利率已高出 4.05 个百分点。</text>
  <text x="64" y="684" font-size="13" fill="#6B7280">数据来源：Q3销售数据.xlsx 明细页，按月份汇总</text>

  <text id="pagenum" x="1196" y="692" font-family="Cambria" font-size="13" fill="#6B7280">3</text>
  <desc id="notes">三个月看走势：7 月 547.7 万元，8 月掉到 476.1 万元、环比 −13.1%，9 月回到 533.3 万元、环比 +12.0%。毛利率是一路向上的：36.74%、37.21%、40.79%。请注意 8 月的毛利率其实是略升的，所以 8 月的问题出在量上，不是降价。9 月毛利额 217.5 万元是三个月最高，但收入比 7 月还低 14.4 万元——拐点是毛利拐点，不是收入拐点。</desc>
