  <rect x="800" y="192" width="1" height="400" fill="#D6DDE4" />

  <g id="pen-1">
    <text x="840" y="206" font-size="20" fill="#1E293B">门锁：跌掉的是高毛利单量</text>
    <text x="840" y="234" font-size="17" fill="#5A6B7B">8 月少 55.5 万元，9 月只回升 18.7 万元，</text>
    <text x="840" y="258" font-size="17" fill="#5A6B7B">仍比 7 月少 36.8 万元，需按单复盘。</text>
  </g>
  <rect x="840" y="278" width="376" height="1" fill="#E8EDF2" />

  <g id="pen-2">
    <text x="840" y="312" font-size="20" fill="#1E293B">安防：唯一逐月爬坡</text>
    <text x="840" y="340" font-size="17" fill="#5A6B7B">9 月比 7 月多 56.5 万元（+62.8%），</text>
    <text x="840" y="364" font-size="17" fill="#5A6B7B">毛利率 37.66%，可作第二曲线。</text>
  </g>
  <rect x="840" y="384" width="376" height="1" fill="#E8EDF2" />

  <g id="pen-3">
    <text x="840" y="418" font-size="20" fill="#1E293B">扫地机：第一品类没回原位</text>
    <text x="840" y="446" font-size="17" fill="#5A6B7B">8 月掉 45.2 万元是单月最大损失，</text>
    <text x="840" y="470" font-size="17" fill="#5A6B7B">9 月仍比 7 月少 30.8 万元。</text>
  </g>
  <rect x="840" y="490" width="376" height="1" fill="#E8EDF2" />

  <g id="pen-4">
    <text x="840" y="524" font-size="20" fill="#1E293B">渗透：高毛利区卖得最少</text>
    <text x="840" y="552" font-size="17" fill="#5A6B7B">华北安防 59.5 万元为五区最低，毛利</text>
    <text x="840" y="576" font-size="17" fill="#5A6B7B">43.4% 却全场最高。</text>
  </g>

  <rect x="64" y="620" width="1152" height="1" fill="#D6DDE4" />
  <text x="64" y="656" font-size="20" fill="#1E293B">智能音箱三个月平走（125.0 / 130.0 / 121.7），规模靠价格维持，没有增长势能。</text>
  <text x="64" y="684" font-size="13" fill="#6B7280">数据来源：Q3销售数据.xlsx 明细页，按品类与月份、区域汇总</text>

  <text id="pagenum" x="1196" y="692" font-family="Cambria" font-size="13" fill="#6B7280">7</text>
  <desc id="notes">看走势：门锁 7 月 152 万元、8 月掉到 96.5 万元、−36.5%，9 月回到 115.2 万元，但仍比 7 月少 36.8 万元。门锁毛利率 39.11% 排第二，所以跌掉的是高毛利单量，要按单复盘供应和交付。安防摄像头是唯一逐月增长的品类，90 万、114.1 万、146.5 万，9 月比 7 月多 56.5 万元、+62.8%，毛利率 37.66%，可以当第二曲线。扫地机器人 8 月掉了 45.2 万元，9 月没回原位。最后一句，渗透上华北安防只做 59.5 万元、毛利却是全场最高的 43.4%。</desc>
</svg>