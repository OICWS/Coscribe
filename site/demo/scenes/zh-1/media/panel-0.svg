  <desc id="notes">这一季先给结论：收入 1,557.1 万元，目标 2,810 万元，只完成 55.4%，缺口 1,252.9 万元。五个区域环比 Q2 全部下滑，降幅从 16.5% 到 31.4%。唯一的好消息是 9 月毛利率回到 40.79%，毛利额 217.5 万元是三个月里最高的。接下来按结果、偏差、成因、承诺四步走。</desc>
