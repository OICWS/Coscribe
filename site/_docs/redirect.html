<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coscribe Docs</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="en/">
<script>
  /* Opens the docs in the reader's language: the one picked here before, then the main site's
     language, then the browser's; English when none of them is published. */
  (function () {
    var choices = {{choices}};
    var pick = null;
    try {
      pick = localStorage.getItem("coscribe-docs-lang");
      if (!pick) { var site = localStorage.getItem("coscribe-lang"); if (site) pick = site === "zh-CN" ? "zh" : "en"; }
    } catch (e) {}
    if (!choices[pick]) {
      pick = null;
      (navigator.languages || [navigator.language || ""]).some(function (l) {
        l = String(l).toLowerCase();
        for (var code in choices) {
          var tag = choices[code].toLowerCase();
          if (l === tag || l.split("-")[0] === tag.split("-")[0]) { pick = code; return true; }
        }
        return false;
      });
    }
    location.replace((pick || "en") + "/" + location.hash);
  })();
</script>
</head>
<body>
<ul>{{links}}</ul>
</body>
</html>
