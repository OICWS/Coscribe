<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23201e1d'/%3E%3Cpath d='M7.5 5h6l3.5 3.5V19h-9.5z' fill='none' stroke='%23fcfcfb' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='M10 12h4.5M10 15h2.5' stroke='%23fcfcfb' stroke-width='1.4' stroke-linecap='round'/%3E%3Crect x='13.6' y='13.6' width='1.4' height='2.8' fill='%234b8fe3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="alternate" type="text/markdown" href="{{markdown_url}}">
<script>
  /* The theme is applied before first paint; the key is the one the main site uses. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("coscribe-theme"); } catch (e) {}
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="{{root}}docs.css">
</head>
<body class="{{page_class}}">
<a class="skip" href="#content">跳到正文</a>
<header class="top">
  <button class="icon-btn menu-btn" id="menu" type="button" aria-label="目录" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="{{site}}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 3h8.5L19 7.5V21H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 12.5h7M9 16.5h3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect class="caret" x="13.6" y="14.6" width="1.6" height="3.8" rx=".4"/>
    </svg>
    <b>coscribe</b>
  </a>
  <a class="brand-docs" href="{{root}}">文档</a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="搜索文档" autocomplete="off" aria-label="搜索文档" aria-controls="results">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox" hidden></div>
  </div>
  <div class="top-end">
    <button class="icon-btn" id="theme" type="button" aria-label="切换深色模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg>
    </button>
    <a class="icon-btn" href="https://github.com/OICWS/coscribe" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .6a11.4 11.4 0 0 0-3.6 22.2c.57.1.78-.25.78-.55v-2c-3.17.69-3.84-1.36-3.84-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.25 3.33.95.1-.74.4-1.25.72-1.53-2.53-.29-5.2-1.27-5.2-5.63 0-1.24.45-2.26 1.18-3.06-.12-.29-.51-1.45.11-3.01 0 0 .96-.31 3.14 1.17a10.9 10.9 0 0 1 5.72 0c2.18-1.48 3.14-1.17 3.14-1.17.62 1.56.23 2.72.11 3.01.73.8 1.18 1.82 1.18 3.06 0 4.37-2.67 5.33-5.21 5.62.41.35.77 1.05.77 2.12v3.14c0 .3.2.66.79.55A11.4 11.4 0 0 0 12 .6z"/></svg>
    </a>
  </div>
</header>
<div class="crumbs-bar">
  <nav class="crumbs" aria-label="位置">{{crumbs}}</nav>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="文档目录">
    <a class="side-home" href="{{root}}">coscribe 文档</a>
    {{sidebar}}
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="content">
    <article class="doc">
      <header class="doc-head">
        <h1>{{h1}}</h1>
        {{lead}}
        <div class="doc-tools">
          <button class="pill" id="copy-md" type="button" data-src="{{markdown_url}}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
            <span>复制 Markdown</span>
          </button>
          <a class="pill quiet" href="{{markdown_url}}">查看 Markdown</a>
        </div>
      </header>
      <div class="prose">
{{body}}
      </div>
      {{pager}}
      <footer class="doc-foot">
        <a href="{{edit_url}}">在 GitHub 上修改这一页</a>
        <a href="https://github.com/OICWS/coscribe/issues/new">文档有误？告诉我们</a>
      </footer>
    </article>
    <aside class="toc-col">{{toc}}</aside>
  </main>
</div>
<script src="{{root}}docs.js"></script>
</body>
</html>
