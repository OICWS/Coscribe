[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coscribe"
version = "0.1.0"
description = "Local, user-friendly agentic system for office work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # cache_control (prompt caching) exists in the SDK's types only from about 0.68.
    "anthropic>=0.68.0,<2.0.0",
    # Part.thought_signature (multi-turn function calling with "thinking" Gemini
    # models) exists from 2.13.0; 2.14.0 removed it again (diffed model_fields against
    # 2.13.0), so the range stops below it. Dependabot ignores this package for that reason.
    "google-genai>=2.13.0,<2.14.0",
    # Explicit pin, not just relying on pydantic-settings'/mcp's/langchain's
    # own transitive floors -- real, live-reported bug: with no upper bound
    # anywhere in this dependency tree, `pip install` on a real Windows
    # machine resolved pydantic to 2.14.0a1, an ALPHA/pre-release build (not
    # a typo -- confirmed via that machine's own `pip show pydantic`). None
    # of mcp==1.29.0's own requirements force this (checked its PyPI wheel
    # metadata directly: `pydantic<3.0.0,>=2.11.0`, comfortably satisfied by
    # any stable 2.11-2.13 release) -- pip fell back to a pre-release only
    # because some other combination of loose constraints across this
    # dependency graph left no stable candidate. Symptom: every MCP
    # connector fails with `PydanticUserError: ClientRequest is not fully
    # defined` from mcp's own session.initialize() -- a real incompatibility
    # in that alpha build's RootModel handling, not anything in coscribe's
    # own code. Upper-bounded below 2.14.0 to keep pip inside the stable
    # 2.x line already verified working throughout this project (2.13.4 in
    # this sandbox); raise this once 2.14 actually ships a stable release
    # and is verified compatible, not just because the alpha exists.
    "pydantic>=2.5.0,<2.15.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # runtime/secrets.py: OS-keychain-backed secret storage, optional at
    # runtime (any keyring.errors.KeyringError falls back to plaintext) --
    # a thin, small, pure-Python meta-package; heavier OS-specific
    # backends (Linux's secretstorage, Windows' pywin32) are keyring's own
    # conditional deps, already handled by its installer per platform.
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    # read_docx/read_pdf reuse the same well-established libraries
    # microsoft/markitdown itself builds on for docx/pdf -> markdown
    # conversion, without markitdown's own mandatory magika dependency
    # (which drags in onnxruntime + numpy, 100+MB, just for file-type
    # sniffing we don't need -- we already know the format per tool).
    "mammoth>=1.7.0",
    "markdownify>=0.13.0",
    "pdfplumber>=0.11.0",
    # read_pdf/search_pdf's text extraction (see tools/office/pdf/text.py's
    # _pdf_page_texts) -- already pulled in by pdfplumber, pinned here
    # because it's now imported directly.
    "pypdfium2>=4.18.0",
    "openpyxl>=3.1.0",
    # Formula values without Excel or LibreOffice (decision 0012); a native
    # extension, so pinned to the version measured against LibreOffice.
    "ironcalc==0.9.0",
    # A deck page previewed from its SVG without an office program (decision
    # 0012); a native extension, so pinned to the version measured.
    "resvg-py==0.5.0",
    # Not actively maintained upstream (no release since Aug 2024) -- unlike
    # the libraries above, this isn't a "mature and audited" pick, just the
    # standard, complete-enough option for this use case. See
    # ARCHITECTURE.md's 范围边界 section.
    "python-pptx>=1.0.0",
    # coscribe's real engine (runtime_lg/, cli.py, web/session.py, web/app.py).
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    # >=1.0.0, not the old 0.3.0 floor -- runtime_lg/agent.py now imports
    # AnthropicPromptCachingMiddleware from langchain_anthropic.middleware,
    # part of the newer "agent middleware" architecture that shipped
    # alongside langchain-anthropic's own 1.x line (the same rewrite that
    # introduced create_agent's middleware= param, already required via
    # langchain>=1.0.0 above) -- a 0.3.x install predates that module
    # existing at all.
    "langchain-anthropic>=1.0.0",
    # Below 4: its ChatGoogleGenerativeAI has no thinking_level field (it takes
    # thinking_config), so runtime_lg/effort.py would silently set nothing.
    "langchain-google-genai>=3.2.0,<4",
    "langchain-openai>=0.2.0",
    # coscribe's persistent checkpointer (cli.py) -- lets --thread
    # survive a process restart. Also used by web/session.py's async
    # twin, AsyncSqliteSaver, from the same package.
    "langgraph-checkpoint-sqlite>=2.0.0",
    # runtime_lg's MCP connector (runtime_lg/mcp.py). It builds each tool's args_schema
    # from the server's real inputSchema, so a model sees the true field names.
    "langchain-mcp-adapters>=0.3.0",
    # runtime_lg/mcp_oauth.py imports its auth types directly.
    "mcp>=1.0.0",
    # web_search tool (tools/web/websearch.py): free, no API key, matching the local-first stance.
    "ddgs>=9.0.0",
    # httpx streams remote images (tools/web/images.py) and talks to the browser panel; the
    # floor is what google-genai and ddgs already require. Pillow validates the
    # downloaded bytes actually decode as an image (a Content-Type header
    # alone isn't trustworthy) and reads real pixel dimensions for
    # set_pptx_background_image's cover-crop math -- no image-processing
    # library existed in this codebase before this.
    "httpx>=0.28.1",
    "Pillow>=10.0.0",
    # Context-window breakdown panel (web/context_usage.py) -- counts
    # tokens for the system prompt/tool schemas/skill listing text to
    # show where a turn's context budget actually goes. OpenAI's
    # cl100k_base encoding, not any specific provider's real tokenizer
    # (Claude/Gemini/custom-OpenAI-compatible providers each have their
    # own) -- a proxy, same "right order of magnitude, not exact" caveat
    # runtime_lg/README.md's own earlier ad-hoc measurement already
    # accepted for the identical reason. The one authoritative number in
    # the panel (total_tokens) still comes from the provider's own last
    # real usage report, not this estimate -- see context_usage.py.
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    # CI reruns a failed test once; tests/flaky_policy.py reports the ones that then pass.
    "pytest-rerunfailures>=14.0",
    "hypothesis>=6.169.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0",
    "types-reportlab>=4.0.0",
    "types-openpyxl>=3.1.0",
    "import-linter>=2.15",
    # scripts/ratchet.py reads the import graph directly (also pulled in by import-linter).
    "grimp>=3.0",
    # scripts/ratchet.py lists names nothing references (dead_code).
    "vulture>=2.14,<3",
]
web = [
    # 0.132.0 rejects a JSON body without a JSON Content-Type. Earlier
    # versions parse one sent with no Content-Type at all -- which any web
    # page can POST to 127.0.0.1 cross-site without a CORS preflight,
    # reaching endpoints that add MCP servers or open files.
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.30.0",
    # Required for FastAPI's UploadFile (POST /api/upload).
    "python-multipart>=0.0.9",
    # web/browser_panel.py's hand-rolled Chrome DevTools Protocol client
    # (the Browser panel's live view -- see that module's own docstring for
    # why raw CDP over a plain WebSocket, not the full `playwright` package:
    # avoids a heavy new PyInstaller-packaging surface for a feature that
    # only needs a thin slice of it). Already pulled in transitively via
    # uvicorn[standard]'s own optional speedups, but declared explicitly
    # since we now depend on it directly, same reasoning python-multipart
    # above already has.
    "websockets>=13.0",
]

[project.scripts]
coscribe = "coscribe.cli:main"
# Needs the `web` extra installed too (FastAPI/uvicorn) -- LangChain/
# LangGraph are now base dependencies, no separate extra needed for those.
coscribe-web = "coscribe.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coscribe"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored, unmodified-from-upstream code (see the header comment in each file):
# left alone so a future diff against ppt-master's source stays meaningful.
extend-exclude = [
    "src/coscribe/tools/_native_formula",
    "src/coscribe/tools/_native_docx_tracks",
    "src/coscribe/tools/_native_svg",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Descriptions and addresses read better on one line each.
"src/coscribe/web/connector_catalog.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = [
    "src/coscribe/tools/_native_formula",
    "src/coscribe/tools/_native_docx_tracks",
    "src/coscribe/tools/_native_svg",
]

[[tool.mypy.overrides]]
module = "mammoth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ironcalc.*", "resvg_py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cairosvg is a dev-only tool for scripts/build_pptx_icons.py (a one-off
# asset-generation script, not part of the shipped runtime tool surface)
# -- deliberately not a [project] dependency, see that script's docstring.
module = "cairosvg.*"
ignore_missing_imports = true

# Vendored code is left out: its coverage says nothing about what a change to
# our own code did.
[tool.coverage.run]
source = ["coscribe"]
branch = true
omit = [
    "*/coscribe/tools/_native_*/*",
]

[tool.coverage.report]
skip_covered = true
# CI measured 88.58% (statements and branches together, our own code) on 2026-10-11,
# against 89% locally. The floor sits just under it: it may only be raised.
fail_under = 88
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evals/` is a sibling of `src/`, not part of the package: its tests import it by name.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "quarantine(issue, until): a known-flaky test, tolerated until the date (tests/flaky_policy.py); after it the test fails",
    "real_libreoffice: uses a real LibreOffice, as an independent reader of a written file or standing in for the office program (conftest.py); skips where LibreOffice is not usable",
]

# Which package may import which. Checked by `lint-imports` (scripts/check.sh,
# so CI too). Layers run top to bottom: a package imports only from layers
# below it. The ignore lists are the violations that existed when this was
# added; each is to be fixed, and a line whose import is gone makes the check
# fail, so the lists can only shrink. Add one only with a decision record.
[tool.importlinter]
root_package = "coscribe"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: a package imports only from the layers below it"
type = "layers"
layers = [
    "coscribe.cli",
    "coscribe.web",
    "coscribe.conversation",
    "coscribe.coordinator | coscribe.runtime_lg",
    "coscribe.workflows | coscribe.code_runtime",
    "coscribe.tools",
    "coscribe.runtime | coscribe.config | coscribe.needs_permission",
]
ignore_imports = [
    "coscribe.tools.bookkeeping.scheduled_tasks -> coscribe.workflows.spec",
    "coscribe.web.app -> coscribe.cli",
]
broken_contract_guidance = "A package may import only from the layers below it (see the root AGENTS.md). Move the shared code down into a lower layer, or pass the value in as an argument. Do not add an ignore line without a decision record."

[[tool.importlinter.contracts]]
name = "Only runtime.secrets talks to the OS keychain"
type = "forbidden"
source_modules = [
    "coscribe.cli", "coscribe.web", "coscribe.conversation", "coscribe.coordinator",
    "coscribe.runtime_lg", "coscribe.workflows", "coscribe.code_runtime", "coscribe.tools",
    "coscribe.config",
]
forbidden_modules = ["keyring"]
allow_indirect_imports = true
broken_contract_guidance = "Only coscribe.runtime.secrets may import keyring. Call store_secret, resolve_secret or delete_secret from coscribe.runtime instead (decision 0003)."

[[tool.importlinter.contracts]]
name = "Only coscribe.web knows about HTTP"
type = "forbidden"
source_modules = [
    "coscribe.cli", "coscribe.conversation", "coscribe.coordinator", "coscribe.runtime_lg",
    "coscribe.workflows", "coscribe.code_runtime", "coscribe.tools", "coscribe.runtime",
    "coscribe.config",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
broken_contract_guidance = "Only coscribe.web may import fastapi, starlette or uvicorn. Keep the HTTP types in a route and pass plain values into the other packages."

[[tool.importlinter.contracts]]
name = "Built-in tools do not depend on LangChain or LangGraph"
type = "forbidden"
source_modules = ["coscribe.tools", "coscribe.runtime"]
forbidden_modules = ["langchain", "langchain_core", "langgraph"]
broken_contract_guidance = "coscribe.tools and coscribe.runtime must not import langchain or langgraph; only runtime_lg and above know the agent loop. Return plain values from a tool and let runtime_lg adapt them."

[[tool.importlinter.contracts]]
name = "A fixed workflow run never reaches an autonomous agent"
type = "forbidden"
source_modules = [
    "coscribe.workflows.engine", "coscribe.workflows.spec",
    "coscribe.workflows.refs", "coscribe.workflows.permissions",
]
forbidden_modules = ["coscribe.code_runtime", "coscribe.runtime_lg", "coscribe.coordinator"]
broken_contract_guidance = "A fixed workflow run must not import code_runtime, runtime_lg or the coordinator: a workflow step never starts an agent that can choose its own actions."

[[tool.importlinter.contracts]]
name = "Office formats: Word, Excel, PowerPoint and PDF do not know each other"
type = "layers"
containers = ["coscribe.tools.office"]
layers = [
    "document_tools",
    "docx | pdf | pptx | xlsx",
    "table_layout",
    "markdown_blocks | toolkit",
]
exhaustive = true
ignore_imports = [
    "coscribe.tools.office.pptx.engine.checker -> coscribe.tools.office.pdf.text",
    "coscribe.tools._thumbnail -> coscribe.tools.office.pptx.engine.build",
    "coscribe.tools._svg_preview -> coscribe.tools.office.pptx.engine.native",
]
broken_contract_guidance = "A format (docx, pdf, pptx, xlsx) may use only the shared modules below it (table_layout, markdown_blocks, toolkit) and tools/ helpers that do not import a format. Move shared code down into one of those instead of importing a sibling format. Do not add an ignore line."

# BEGIN generated from components.toml (python office-agent/scripts/gen_components.py)

[[tool.importlinter.contracts]]
name = "coscribe.web is entered through its package"
type = "protected"
protected_modules = ["coscribe.web.*"]
allowed_importers = ["coscribe.web"]
