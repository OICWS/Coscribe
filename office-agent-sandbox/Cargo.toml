# Built inside a checkout of openai/codex at the tag in CODEX_TAG, as a member of its workspace,
# so every dependency is the version Codex's own Cargo.lock pins (scripts/build.sh).
[package]
name = "coscribe-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "coscribe-sandbox"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-windows-sandbox = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
